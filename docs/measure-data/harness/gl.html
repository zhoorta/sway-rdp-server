<!doctype html><body style="margin:0;background:#000"><canvas id=c width=1280 height=720 style="width:100vw;height:100vh"></canvas><script>
const c=document.getElementById('c'),g=c.getContext('webgl');
const vs='attribute vec2 p;void main(){gl_Position=vec4(p,0,1);}';
const fs='precision highp float;uniform float t;void main(){vec2 u=gl_FragCoord.xy/vec2(1280.,720.)*2.-1.;float s=0.;for(int i=0;i<80;i++){u=abs(u)/dot(u,u)-vec2(.9+.1*sin(t*.3));s+=length(u);}gl_FragColor=vec4(vec3(sin(s*.1+t),sin(s*.13),cos(s*.07)),1.);}';
function sh(t,s){const x=g.createShader(t);g.shaderSource(x,s);g.compileShader(x);return x}
const pr=g.createProgram();g.attachShader(pr,sh(g.VERTEX_SHADER,vs));g.attachShader(pr,sh(g.FRAGMENT_SHADER,fs));g.linkProgram(pr);g.useProgram(pr);
const b=g.createBuffer();g.bindBuffer(g.ARRAY_BUFFER,b);g.bufferData(g.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),g.STATIC_DRAW);
const l=g.getAttribLocation(pr,'p');g.enableVertexAttribArray(l);g.vertexAttribPointer(l,2,g.FLOAT,false,0,0);
const tl=g.getUniformLocation(pr,'t');let n=0,t0=performance.now();
function f(now){g.uniform1f(tl,now/1000);g.drawArrays(g.TRIANGLE_STRIP,0,4);n++;if(now-t0>2000){document.title='fps '+Math.round(n*1000/(now-t0));n=0;t0=now}requestAnimationFrame(f)}requestAnimationFrame(f)
</script>
