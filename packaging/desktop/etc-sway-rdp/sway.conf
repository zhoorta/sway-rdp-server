# sway-rdp desktop: the sway config of RDP sessions (a copy in ~/.config/sway-rdp/config replaces it for one account).
# Windows-like on purpose: windows float with title bars, Alt+Tab switches, Alt+F4 closes. The shell (bar, launcher,
# notifications, wallpaper) is DankMaterialShell when it is installed (sway-rdp-setup), otherwise sway's own bar.

set $mod Mod4
set $term foot
set $menu sway-rdp-launcher

font pango:Inter 10
default_border normal 2
default_floating_border normal 2
floating_modifier $mod normal
focus_follows_mouse yes

# Windows float.
for_window [app_id=".*"] floating enable
for_window [class=".*"] floating enable

# Keys
bindsym $mod+Return exec $term
bindsym $mod+d exec $menu
bindsym $mod+q kill
bindsym Mod1+F4 kill
bindsym Mod1+Tab focus next
bindsym Mod1+Shift+Tab focus prev
bindsym $mod+f fullscreen toggle
bindsym $mod+Shift+space floating toggle
bindsym $mod+Shift+c reload
bindsym $mod+Shift+e exec swaynag -t warning -m 'End this session? All your windows will close.' -B 'End session' 'swaymsg exit'
bindsym Print exec sh -c 'mkdir -p ~/Pictures && grim ~/Pictures/screenshot-$(date +%Y%m%d-%H%M%S).png'
bindsym $mod+Shift+s exec sh -c 'grim -g "$(slurp)" - | wl-copy'

# sway's own bar stays hidden; sway-rdp-shell shows it only when there is no other shell.
bar {
    mode invisible
    modifier none
}

exec sway-rdp-shell
