# sway-rdp desktop: the sway config of RDP sessions (a copy in ~/.config/sway-rdp/config replaces it for one account).
# Windows-like on purpose: windows float with title bars, Alt+Tab switches, Alt+F4 closes. The shell (bar, launcher,
# notifications, wallpaper) is DankMaterialShell when it is installed (sway-rdp-setup), otherwise sway's own bar.

set $mod Mod4
set $term foot
set $menu sway-rdp-launcher

font pango:Inter 10
default_border normal 2
# Title bars in quiet greys that suit any shell theme (focused / unfocused).
#                       border    background text      indicator child_border
client.focused          #4a4a4a   #3a3a3a    #f2f2f2   #4a4a4a   #4a4a4a
client.focused_inactive #2a2a2a   #262626    #b8b8b8   #2a2a2a   #2a2a2a
client.unfocused        #2a2a2a   #202020    #8a8a8a   #2a2a2a   #2a2a2a
client.urgent           #8a3a3a   #6a2a2a    #f2f2f2   #8a3a3a   #8a3a3a
titlebar_padding 8 4
default_floating_border normal 2
floating_modifier $mod normal
# A window gets the focus when it is clicked, not when the pointer passes over it.
focus_follows_mouse no

# Windows float.
for_window [app_id=".*"] floating enable
for_window [class=".*"] floating enable
# LibreOffice asks for the whole screen; as a floating window its title bar then lands above the top edge, out of reach.
for_window [class="libreoffice.*"] resize set 1300 800, move position center
for_window [app_id="libreoffice.*"] resize set 1300 800, move position center
# DMS's password prompt (polkit) is a fixed 460x220 window and the text does not fit; make it bigger and centred.
for_window [title="^Authentication$"] resize set 620 380, move position center

# Keys
bindsym $mod+Return exec $term
bindsym $mod+d exec $menu
bindsym $mod+q kill
bindsym Mod1+F4 kill
bindsym Mod1+Tab focus next
bindsym Mod1+Shift+Tab focus prev
bindsym $mod+f fullscreen toggle
bindsym $mod+Shift+space floating toggle
# Maximize / minimize (windows have no such buttons on their title bars): Super+Up, Super+Down, Super+Shift+Down brings one back.
# Super+Shift+Up pulls windows that ended up under the bar or off the screen back.
bindsym $mod+Up exec sway-rdp-windows maximize
bindsym $mod+Down exec sway-rdp-windows minimize
bindsym $mod+Shift+Down exec sway-rdp-windows restore
bindsym $mod+Shift+Up exec sway-rdp-windows fit
bindsym $mod+Shift+c reload
bindsym $mod+Shift+e exec swaynag -t warning -m 'End this session? All your windows will close.' -B 'End session' 'swaymsg exit'
bindsym Print exec sh -c 'mkdir -p ~/Pictures && grim ~/Pictures/screenshot-$(date +%Y%m%d-%H%M%S).png'
bindsym $mod+Shift+s exec sh -c 'grim -g "$(slurp)" - | wl-copy'

# sway's own bar stays hidden; sway-rdp-shell shows it only when there is no other shell.
bar {
    mode invisible
    modifier none
}

exec sway-rdp-shell
exec sway-rdp-windows watch
exec sway-rdp-desktop
