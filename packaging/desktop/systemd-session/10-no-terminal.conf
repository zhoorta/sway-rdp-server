# The desktop has its own launcher, bar and desktop icons: do not open a terminal (foot) in every new session. This repeats
# ExecStart of sway-rdp-session@.service (both packages are versioned together) with --no-terminal added.
[Service]
ExecStart=
ExecStart=/usr/bin/sway-rdp-server --session-worker --own-sway --no-terminal --register /run/sway-rdp/sessions.sock $SWAY_RDP_SESSION_ARGS
