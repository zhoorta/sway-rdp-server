# The desktop has its own launcher, bar and desktop icons: do not open a terminal (foot) in every new session. This repeats
# ExecStart of waydesk-session@.service (both packages are versioned together) with --no-terminal added.
[Service]
ExecStart=
ExecStart=/usr/bin/waydesk-server --session-worker --own-sway --no-terminal --register /run/waydesk/sessions.sock $WAYDESK_SESSION_ARGS
