# The `cosmic` desktop (waydesk-admin users set NAME --desktop cosmic, docs/COSMIC.md): the session's sway has one job, to run COSMIC.
# start-cosmic starts cosmic-session, whose compositor (cosmic-comp) finds this sway's display and runs as a window of it; the window
# is made fullscreen on the session's output, so the picture, the keyboard and the pointer pass through sway to COSMIC unchanged.
# An account can replace this file with its own in ~/.config/waydesk/config.
default_border none
for_window [title=".*"] fullscreen enable
# The session's own terminal (waydesk-server starts `foot -T waydesk-server-session` in every sway session) must not be drawn over the desktop: Debian's sway 1.10 draws it above the
# fullscreen window of the desktop, so the user would see a terminal and not the desktop. It stays alive, out of sight, in the scratchpad.
for_window [title="waydesk-server-session"] move scratchpad
# The cursor is drawn by the client, not into the picture: COSMIC draws its own pointer into its output for some shapes, so it gets the invisible theme
# (the shape the client draws still comes from COSMIC's cursor requests to this sway).
# When the desktop quits (the user chose Log out, or it crashed) the session ends with it: sway exits, the worker sees that and disconnects the client, and the next login starts a
# fresh desktop. Without this the client was left with an empty sway, a dark screen, and a reconnection went back to it.
exec sh -c 'env XCURSOR_THEME=waydesk-blank start-cosmic; swaymsg exit'
