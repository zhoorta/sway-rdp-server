# The `plasma` desktop (waydesk-admin users set NAME --desktop plasma, docs/PLASMA.md): the session's sway has one job, to run KDE Plasma.
# startplasma-wayland starts KWin, which finds this sway's display and runs as a window of it; the window is made fullscreen on the session's
# output, so the picture, the keyboard and the pointer pass through sway to Plasma unchanged.
# An account can replace this file with its own in ~/.config/waydesk/config.
default_border none
for_window [title=".*"] fullscreen enable
# No invisible cursor theme here (COSMIC needs one): KWin hands this sway the cursor image it wants, and that image is what the client draws; with a blank theme
# the client's pointer is invisible.
exec startplasma-wayland
