# With compressed swap in RAM, paging out is cheap: let the kernel use it for idle pages instead of dropping the cache of the
# programs people are working in. page-cluster 0: a swap read brings one page, not eight (right for zram, which has no seek time).
# Override in /etc/sysctl.d/ (a file with the same name replaces this one).
vm.swappiness = 100
vm.page-cluster = 0
