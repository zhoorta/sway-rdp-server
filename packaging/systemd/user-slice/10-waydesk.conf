# Limits for every account's slice (user-<uid>.slice), which holds a Waydesk desktop and everything started in it.
# They are ceilings, not shares: nobody is held to less than they need while the machine has room (CPU is left alone: all accounts have
# the same CPUWeight, so a busy account gets every idle core and gives way only when the others want theirs).
#  - No account can take more than half of the machine (a runaway browser, a leak, a build): when it reaches MemoryHigh the kernel
#    reclaims from that account first (and swaps its idle pages), at MemoryMax it kills the biggest process of that account and nobody else's.
#  - No account can fill the swap: MemorySwapMax.
#  - A fork bomb stops at TasksMax.
# Percentages follow the size of the machine. An account that needs more (VS Code with builds, a big spreadsheet) gets it with
# `waydesk-admin users limit NAME --memory 12G`; to change them for everybody put a file with this name in
# /etc/systemd/system/user-.slice.d/ (it replaces this one). The name starts with 10 on purpose: `systemctl set-property` (and
# `waydesk-admin users limit`) writes files called 50-..., which must come after this one to win.
[Slice]
TasksMax=8192
MemoryHigh=35%
MemoryMax=50%
MemorySwapMax=50%
