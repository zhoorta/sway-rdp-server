# Limits for every account's slice (user-<uid>.slice), which holds a Waydesk desktop and everything started in it.
# One account cannot take the host down with a fork bomb or a runaway program; the others keep working.
# MemoryHigh makes the account's processes slow down (reclaim) before MemoryMax kills the biggest one.
# These are per account and static, so they do not share RAM fairly between accounts; for that, set MemoryMax for the
# machine size in /etc/systemd/system/user-.slice.d/ (a file with the same name replaces this one).
[Slice]
TasksMax=8192
MemoryHigh=80%
MemoryMax=90%
