# Compressed swap in RAM for the host of Waydesk sessions (systemd-zram-generator, a dependency of waydesk-server). Idle desktop memory
# (the shell, portals, background tabs, an idle editor) compresses about 4.5 to 1 with zstd, so a whole RAM's worth of swap costs about a fifth of the RAM
# when it is full, and a short spike is absorbed instead of killing someone's browser.
# Debian's own file makes the device half of the RAM, at most 4 GiB; this one makes it as large as the RAM, at most 16 GiB, and picks zstd.
# Measured on an 8 GB / 4 vCPU server with heavy users (Chromium, LibreOffice Calc, VS Code): 6 users with the default size, 8 with this one.
# Change or switch it off in /etc/systemd/zram-generator.conf.d/ (a file with the same name replaces this one).
[zram0]
zram-size = min(ram, 16384)
compression-algorithm = zstd
