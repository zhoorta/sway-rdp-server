# Compressed swap in RAM for the host of Waydesk sessions (systemd-zram-generator, recommended by waydesk-server). Idle desktop memory
# (the shell, portals, background tabs) compresses to a third or less, so a short spike is absorbed instead of killing someone's browser.
# Debian's own file makes the device (half of the RAM, at most 4 GiB, priority 100); this one only picks the better algorithm.
# Change or switch it off in /etc/systemd/zram-generator.conf.d/ (a file with the same name replaces this one).
[zram0]
compression-algorithm = zstd
